# Traefik static configuration
# Reloaded only on container restart.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Entry points: HTTP serves the ACME challenge and redirects everything else
# to HTTPS; HTTPS terminates TLS.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

# Service discovery via Docker labels.
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: rm-sync-network

# Let's Encrypt via HTTP-01 challenge on the `web` entry point.
# Inbound port 80 reaches us via the nginx front proxy on the MediaWiki host,
# which forwards Host: remarkable.brothersbrothers.net to this host.
# CA endpoint and email are provided via environment variables.
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# Dashboard intentionally disabled.
api:
  dashboard: false
  insecure: false
