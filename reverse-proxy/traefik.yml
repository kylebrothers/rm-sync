# Traefik static configuration
# Reloaded only on container restart.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Entry points: HTTP redirects to HTTPS; HTTPS terminates TLS.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

# Service discovery via Docker labels.
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: rm-sync-network

# Let's Encrypt via Cloudflare DNS-01 challenge.
# CA endpoint and email are provided via environment variables.
certificatesResolvers:
  cloudflare:
    acme:
      email: "{{ env "ACME_EMAIL" }}"
      caServer: "{{ env "ACME_CA" }}"
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        # Use Cloudflare's resolvers to avoid propagation issues with local DNS.
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

# Dashboard intentionally disabled.
api:
  dashboard: false
  insecure: false
